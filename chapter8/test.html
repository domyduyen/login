<!DOCTYPE html><!--Khai báo HTML-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra markup</title>
    <meta http-equiv="refresh" content="5">

    <style>
        #header{
          color: blue;
          font-style: italic;
        }
        .note {
         color: rgb(18, 26, 63);
         padding: 1;
         font-size: large;
        }
     .highlight {
        color: red;
        font-weight: bold;
     }


    </style>
    
</head>
<body>
    <div id ="header">
        <h1>Welcome to My website</h1>
        <h1>My name is <span class="highlight">Duyên</span></h1>
    </div>
    <div>
        <p class="note">This is an important note.</p>
        <p class="note">Another note with same style.</p>
        <p>This is a <em>simple</em> sentence.</p>
        <p>The word <span class="highlight">HTML</span> stands for HyperText Markup Language.</p>

    </div>
        <iframe src="http://maps.google.co.uk/maps?q=moma+new+york&amp;output=embed"
        width="450" height="350" frameborder="1" scrolling="no">
        
       </iframe>
    <p>5 &lt; 10 and 10 &gt; 5. Copyright &copy; 2025</p>


</body>
</html>
